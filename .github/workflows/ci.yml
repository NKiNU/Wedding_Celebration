name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # Canary secrets: the build runs with them, and the scan proves none reached the browser.
      - run: npm run build
        env: &canaries
          SUPABASE_SERVICE_ROLE_KEY: ci-canary-service-role-key-7f3a
          R2_ACCESS_KEY_ID: ci-canary-r2-access-key-id-7f3a
          R2_SECRET_ACCESS_KEY: ci-canary-r2-secret-access-key-7f3a
          DEVICE_TOKEN_PEPPER: ci-canary-device-token-pepper-7f3a-0000000000
          ADMIN_PASSCODE: ci-canary-admin-passcode-7f3a
          CRON_SECRET: ci-canary-cron-secret-7f3a
      - run: npm run check:bundle -- --strict
        env: *canaries

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # staticcheck's own go.mod would pick Go 1.26, which cannot read Go 1.27 packages.
      - run: GOTOOLCHAIN=go1.27.0 go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go build -o /dev/null ./cmd/server
      # Same 80 % floor as vitest; cmd/ is startup glue, like the pages vitest leaves out.
      - run: go test -race -coverprofile=cover.out ./internal/...
      - run: go tool cover -func=cover.out | awk '/^total:/ { sub("%", "", $3); if ($3 < 80) { print "coverage " $3 "% < 80%"; exit 1 } }'
